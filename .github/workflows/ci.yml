name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync workspace
        run: uv sync --all-packages --python ${{ matrix.python-version }}

      # The reference gallery's eight browser tests render the boards in a
      # headless Chromium and skip without one; Playwright's is the one the
      # tool itself offers through --init.
      - name: Install Chromium for the gallery tests
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Format check
        run: uv run --no-sync ruff format --check .

      - name: Notebook check
        run: uv run --no-sync marimo check notebooks/*/bac_*.py notebooks/*/demo/*.py ops/*/src/*/notebook.py

      - name: Tests
        run: uv run --no-sync pytest

      - name: Conventions
        run: uv run --no-sync bac-convention-check . --format report
