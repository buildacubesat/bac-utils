[project]
name = "bac-suite-db"
version = "0.1.0"
description = "Shared PostgreSQL layer of the Build a CubeSat business operations suite: schema, connection and config, SKU validation, the bac-db CLI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bac-common>=0.3",
    "typer>=0.12",
    "rich>=13.7",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
bac-db = "bac_suite_db.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bac_suite_db"]

[tool.uv.sources]
bac-common = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
