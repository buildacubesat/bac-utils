[project]
name = "bac-common"
version = "0.1.0"
description = "Shared CLI scaffold for Build a CubeSat tools: standard flags, config, terminal profile, error boundary."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
prompts = ["InquirerPy>=0.3.4"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bac_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
