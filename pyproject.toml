# bac-utils – workspace root
# Build a CubeSat – utilities monorepo. Each tool under lib/, tools/, notebooks/ and ops/
# is its own uv project; this file only ties them together for `uv sync`,
# `uv run pytest` and CI. Install a single tool with
#   uv tool install ./tools/<name>

[tool.uv.workspace]
members = ["lib/*", "tools/*", "notebooks/*", "ops/*"]
# notebooks/tests holds the cross-tool profile checks; it is a test folder, not a member
exclude = ["notebooks/tests"]

[tool.uv.sources]
bac-common = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py311"
# honour excludes even when a file is named explicitly (editors, pre-commit)
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008: Typer declares options via function calls in defaults by design.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Prompt text and test fixtures are literal strings; wrapping them changes them.
"**/llm.py" = ["E501"]
"**/tests/*" = ["E501"]
# marimo notebooks: markdown table rows must stay on one line; a cell's last bare
# expression is its output, not a useless statement; and a name assigned at the top of
# a cell is a notebook global (the harness and the tests read it through `defs`) even
# when no other cell uses it, so it is not an unused local.
"notebooks/**/*.py" = ["E501", "B018", "F841"]
"ops/*/src/*/notebook.py" = ["E501", "B018", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["bac_common", "bac_kicad_common", "bac_suite_db", "notebook_harness", "bac_vse_tools"]

[tool.pytest.ini_options]
testpaths = ["lib", "tools", "notebooks", "ops", "blender"]
# importlib mode lets every tool keep its own tests/test_cli.py without
# module-name collisions when the whole workspace runs in one session.
addopts = "-q --import-mode=importlib"
