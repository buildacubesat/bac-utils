[project]
name = "bac-kicad-maintain"
version = "1.4.0"
description = "Text, courtyard, via, label and title-block conventions on KiCad boards and schematics, the library audit, the catalog check, and symbol-library renames, editing files by span."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bac-common>=0.5",
    "bac-kicad-common>=0.1",
    "rich>=13.7",
    "typer>=0.12",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
bac-kicad-maintain = "bac_kicad_maintain.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bac_kicad_maintain"]

[tool.uv.sources]
bac-common = { workspace = true }
bac-kicad-common = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
