[project]
name = "bac-page"
version = "0.5.0"
description = "Create and manage bac.page short URLs: a redirect folder per slug in the Pages repository, committed and pushed."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bac-common>=0.4",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "InquirerPy>=0.3",
    "qrcode[pil]>=7.4",
    "pillow>=10.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
bac-page = "bac_page.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bac_page"]

[tool.uv.sources]
bac-common = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
