[project]
name = "bac-kicad-generate-artifacts"
version = "0.6.1"
description = "Generate the release artifacts of a KiCad project: render, pinout, schematic PDF, BOM, iBOM, Gerbers, drills, centroid, STEP, QR marker and the manufacturing ZIP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bac-common>=0.3",
    "rich>=13.7",
    "pillow>=10.1",
    "qrcode>=7.4",
]

# Programs on PATH at run time: kicad-cli (KiCad 10) and inkscape or rsvg-convert.
# Optional: a system python3 with pcbnew and the InteractiveHtmlBom plugin for the iBOM stage;
# xdg-open / open and gerbview for --open.

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
bac-kicad-generate-artifacts = "bac_kicad_generate_artifacts.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bac_kicad_generate_artifacts"]

[tool.uv.sources]
bac-common = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
