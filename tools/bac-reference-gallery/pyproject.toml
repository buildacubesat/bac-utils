[project]
name = "bac-reference-gallery"
version = "0.4.0"
description = "The Build a CubeSat reference gallery: design exemplars for the BAC guides, the shared tokens.css, and a PNG/PDF renderer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bac-common>=0.4",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "playwright>=1.50",
    "pypdf>=5.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
bac-reference-gallery = "bac_reference_gallery.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bac_reference_gallery"]

# The pages ship inside the package so an installed renderer finds them; in a
# checkout they are read from the tool folder (see site.py).
[tool.hatch.build.targets.wheel.force-include]
"index.html" = "bac_reference_gallery/pages/index.html"
"css" = "bac_reference_gallery/pages/css"
"assets" = "bac_reference_gallery/pages/assets"
"examples" = "bac_reference_gallery/pages/examples"

[tool.uv.sources]
bac-common = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
