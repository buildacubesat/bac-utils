[project]
name = "bac-store-product-cropper"
version = "0.2.0"
description = "Interactive crop of product photos for the store with size-targeted WebP export."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bac-common>=0.3",
    "bac-media-convert>=0.1",
    "rich>=13.7",
    "pillow>=10.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
bac-store-product-cropper = "bac_store_product_cropper.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bac_store_product_cropper"]

[tool.uv.sources]
bac-common = { workspace = true }
bac-media-convert = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
