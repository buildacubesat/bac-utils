# bac-convention-check – rule set "firmware"
# Build a CubeSat – review heuristics for the flight software (Rocinante) and
# hardware repositories: stale part references, addressing conventions, and
# recurring review findings. These encode decisions of those projects, not of
# the guides, and are owned by bac-software / bac-hardware. Run with
# `--rules guide --rules firmware`.

[[rules]]
id = "B9"
severity = "blocking"
title = "Mixed-case Roci"
kind = "regex"
pattern = "\\bROCI\\b|\\bRoci_|\\brOci\\b|\\bRoCi\\b"
include = ["*.md", "*.c", "*.h", "*.cpp", "*.hpp", "*.fpp", "*.py", "*.toml", "*.txt"]

[[rules]]
id = "C1"
severity = "advisory"
title = "BAC_ vs ROCI_ prefix inventory (unsettled decision)"
kind = "builtin"
builtin = "prefix_inventory"
include = ["*.h", "*.c", "*.hpp", "*.cpp", "Kconfig*"]

[[rules]]
id = "D1"
severity = "advisory"
title = "Hardcoded 31 or 0x1F near addressing (broadcast is netmask-derived)"
kind = "regex"
pattern = "\\b(31|0x1[Ff])\\b"
include = ["*.c", "*.h", "*.cpp", "*.hpp", "*.fpp"]
keep = "addr|node|broadcast|netmask|mask|csp"

[[rules]]
id = "D2"
severity = "blocking"
title = "aliveNodes narrower than U64"
kind = "regex"
pattern = "aliveNodes"
include = ["*.c", "*.h", "*.cpp", "*.hpp", "*.fpp"]
keep = "U8|U16|U32|uint8|uint16|uint32"

[[rules]]
id = "E1"
severity = "blocking"
title = "ADS1113 reference (the part is ADS1115)"
kind = "regex"
pattern = "ads1113"
ignore_case = true
include = ["*.md", "*.txt", "*.rst", "*.resc", "*.repl", "*.cfg", "*.toml", "*.py"]

[[rules]]
id = "E2"
severity = "blocking"
title = "ADS1113 symbol or devicetree node"
kind = "regex"
pattern = "bac_ads1113_|CONFIG_BAC_SENSOR_ADS1113|DT_HAS_TI_ADS1113_ENABLED|ti,ads1113|ads1113@"
ignore_case = true
include = ["*.c", "*.h", "*.dts", "*.dtsi", "*.overlay", "Kconfig*", "*.conf"]

[[rules]]
id = "E3"
severity = "advisory"
title = "Wrong CAN controller family (carrier part is MCP251863)"
kind = "regex"
pattern = "\\bmcp2515\\b|\\bmcp2517\\b|\\bmcp2518\\b"
ignore_case = true
include = ["*.c", "*.h", "*.md", "*.dts", "*.dtsi", "*.overlay", "*.cfg", "*.repl", "*.resc", "Kconfig*"]

[[rules]]
id = "E4"
severity = "blocking"
title = "CAN FD enabled (small nodes are bxCAN, CAN 2.0B only)"
kind = "regex"
pattern = "FDMode\\s*=\\s*(yes|true|1)|DataBitRate|CONFIG_CAN_FD_MODE=y|can-fd|fd-mode"
ignore_case = true
include = ["*.cfg", "*.conf", "*.network", "*.dts", "*.dtsi", "*.overlay", "Kconfig*", "*.c", "*.h"]

[[rules]]
id = "E5"
severity = "blocking"
title = "Stale 'no CAN hardware' or 'CAN planned' status"
kind = "regex"
pattern = "no CAN hw|no CAN hardware|CAN[^.]{0,30}(PLANNED|not yet|TODO)"
ignore_case = true
include = ["*.h", "*.c", "*.md", "*.txt", "*.rst"]

[[rules]]
id = "E6"
severity = "blocking"
title = "STM32F4 variant other than F405"
kind = "regex"
pattern = "stm32f4(07|15|17|27|29|37|39|46|69)"
ignore_case = true
include = ["*.c", "*.h", "*.md", "*.dts", "*.dtsi", "*.overlay", "*.repl", "*.resc", "Kconfig*", "*.conf"]

[[rules]]
id = "E7"
severity = "advisory"
title = "BNO055 reference outside history and driver context (the part is BNO086)"
kind = "regex"
pattern = "bno055"
ignore_case = true
include = ["*.c", "*.h", "*.cpp", "*.hpp", "*.fpp", "*.md", "*.dts", "*.dtsi", "*.overlay", "Kconfig*"]
drop = "20[0-9]{2}-[0-9]{2}-[0-9]{2}|→|->|NRND|revers|instead of|rather than|autoload|wrong .?bno055|\\| 0\\.[0-9]"
note = "BNO055 was proposed in TN-001 0.3.1 and reversed in 0.3.2; it may appear in histories and rationale only."

[[rules]]
id = "E8"
severity = "advisory"
title = "More than one CAN transceiver family named"
kind = "builtin"
builtin = "transceiver_families"
include = ["*.c", "*.h", "*.md", "*.dts", "*.dtsi", "*.overlay", "*.repl", "*.resc", "Kconfig*"]

[[rules]]
id = "E9"
severity = "advisory"
title = "Part named in docs but absent from devicetree, Kconfig and sources"
kind = "builtin"
builtin = "orphan_parts"
include = ["*.md", "*.rst", "*.txt", "*.dts", "*.dtsi", "*.overlay", "Kconfig*", "*.conf", "*.c", "*.h", "*.repl"]

[[rules]]
id = "G1"
severity = "advisory"
title = "GPIO return value ignored"
kind = "regex"
pattern = "^\\s*gpio_pin_(set|get|configure|toggle)[a-z_]*\\("
include = ["*.c"]
drop = "="

[[rules]]
id = "G2"
severity = "advisory"
title = "csp_send call sites (check for use-after-free)"
kind = "regex"
pattern = "csp_send\\s*\\("
include = ["*.c", "*.cpp"]

[[rules]]
id = "G3"
severity = "advisory"
title = "Static global buffers (check for races)"
kind = "regex"
pattern = "^static\\s+[A-Za-z_0-9 ]+[A-Za-z_0-9]+\\[[A-Za-z_0-9]+\\]\\s*;"
include = ["*.c", "*.cpp"]
