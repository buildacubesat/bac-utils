[project]
name = "bac-kicad-symfields"
version = "0.3.0"
description = "Unify property fields and lint text sizes across KiCad symbol and footprint libraries, from TOML rules, editing files by span."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bac-common>=0.2",
    "bac-kicad-common>=0.1",
    "typer>=0.12",
    "rich>=13.7",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
bac-kicad-symfields = "bac_kicad_symfields.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bac_kicad_symfields"]

[tool.uv.sources]
bac-common = { workspace = true }
bac-kicad-common = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
