# Build a CubeSat – example rules for a board schematic (bac-kicad-schfields).
# Fields and flags on placed symbols. `Reference` cannot be set here.
title = "Board-level fields and flags"
target = "schematic"

[match]
reference_regex = ["^(R|C|TP)"]

# A lookup table: part number by value, resistors only. Needs --allow-overwrite
# on the run to replace a value that is already there.
[[field]]
name = "Manufacturer PN"
value = "RC0603FR-0710KL"
when = { Value = "^10k$" }
when_reference = "^R"
overwrite = true

[[field]]
name = "Manufacturer PN"
value = "RC0603FR-071KL"
when = { Value = "^1k$" }
when_reference = "^R"
overwrite = true

# Test points are neither populated nor in the BOM. Needs --allow-flags.
[[flag]]
name = "dnp"
value = true
when_reference = "^TP"

[[flag]]
name = "in_bom"
value = false
when_reference = "^TP"
