# Build a CubeSat – example field rules for bac-kicad-symfields.
# Retired as the BAC workflow on 2026-11-05: the library is thin now (Reference, Value, Footprint,
# Datasheet, Description, Manufacturer PN) and the part data lives in bac-hardware/resources/catalog/.
# The files stay as examples of the rule syntax.
# Every symbol carries the sourcing fields, hidden, at the small property size.
# Empty values are placeholders: the field exists so the symbol fields table
# shows it, and a later rule or a person fills it.
title = "Sourcing fields on every symbol"
target = "symbol"

[[field]]
name = "Manufacturer"
value = ""
size = 0.762

[[field]]
name = "Manufacturer PN"
value = ""
size = 0.762

[[field]]
name = "BOM"
value = ""

[[field]]
name = "DNP"
value = ""
