[project]
name = "bac-kicad-stitch"
version = "0.1.1"
description = "Ground stitching vias on a KiCad board: finds the gaps in via coverage and fills them where a via is DRC-clean, editing the file by span."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bac-common>=0.4",
    "bac-kicad-common>=0.1",
    "numpy>=1.26",
    "rich>=13.7",
    "scipy>=1.11",
    "shapely>=2.0",
    "typer>=0.12",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
bac-kicad-stitch = "bac_kicad_stitch.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bac_kicad_stitch"]

[tool.uv.sources]
bac-common = { workspace = true }
bac-kicad-common = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
