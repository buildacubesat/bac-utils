[project]
name = "bac-media-convert"
version = "0.1.0"
description = "Batch media conversions for Build a CubeSat: square WebP product images, constant-frame-rate MP4 from variable-rate video."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bac-common>=0.1",
    "typer>=0.12",
    "rich>=13.7",
    "pillow>=10.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
bac-media-convert = "bac_media_convert.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bac_media_convert"]

[tool.uv.sources]
bac-common = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
