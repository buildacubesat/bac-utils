[project]
name = "bac-antenna-optimizer"
version = "0.7.4"
description = "Cavity-model and openEMS optimiser for CubeSat antennas – parametric geometry, meshing rules, sweeps and reports"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Build a CubeSat contributors" }]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
simulation = ["h5py>=3.10"]  # plus the openEMS/CSXCAD bindings from the system install
report = ["matplotlib>=3.8", "h5py>=3.10", "cairosvg>=2.7", "pillow>=10.0"]  # bac-antenna report / charts / drawings / webp

[project.scripts]
bac-antenna = "bac_antenna.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bac_antenna"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
