[project]
name = "bac-can-up"
version = "1.2.0"
description = "Bring up a CANable SLCAN interface for Build a CubeSat bench testing: stop a stale slcand, start a fresh one, set the bitrate, bring can0 up."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bac-common>=0.2",
    "rich>=13.7",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
bac-can-up = "bac_can_up.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bac_can_up"]

[tool.uv.sources]
bac-common = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
