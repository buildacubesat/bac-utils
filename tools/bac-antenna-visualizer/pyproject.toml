[project]
name = "bac-antenna-visualizer"
version = "0.3.0"
description = "Marimo notebook: how an antenna's characteristics move with its geometry, from bac-antenna-optimizer sensitivity packs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.9",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "altair>=5.4",
    "plotly>=5.20",
    "bac-antenna-optimizer",           # live geometry and the cavity estimator; a workspace member in bac-utils
]

[tool.uv.sources]
bac-antenna-optimizer = { workspace = true }
