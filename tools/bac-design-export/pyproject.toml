[project]
name = "bac-design-export"
version = "0.1.0"
description = "Exports the BAC guides in bac-design from Markdown to PDF as BAC documents: the design tokens, the self-hosted fonts and a print stylesheet, rendered by WeasyPrint."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bac-common>=0.4.2",
    "bac-design-tokens>=0.1.0",
    "fonttools>=4.50",
    "markdown-it-py>=3.0",
    "pypdf>=4.0",
    "rich>=13.7",
    "weasyprint>=62.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
bac-design-export = "bac_design_export.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bac_design_export"]

[tool.uv.sources]
bac-common = { workspace = true }
bac-design-tokens = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
