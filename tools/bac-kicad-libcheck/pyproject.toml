[project]
name = "bac-kicad-libcheck"
version = "0.2.0"
description = "Verify a KiCad library project: every symbol and footprint placed exactly once, in sync with its library, with resolvable 3D models."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bac-common>=0.2",
    "bac-kicad-common>=0.1",
    "rich>=13.7",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
bac-kicad-libcheck = "bac_kicad_libcheck.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bac_kicad_libcheck"]

[tool.uv.sources]
bac-common = { workspace = true }
bac-kicad-common = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
