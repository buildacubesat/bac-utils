[project]
name = "bac-power-budget"
version = "0.5.4"
description = "Marimo notebook: energy balance on one timeline – per-face generation, loads per mode, beacon cadence, battery state of charge with safe-mode fallback"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Build a CubeSat contributors" }]
# A single-file marimo notebook: these dependencies are what the headless tests need; the notebook
# carries its own PEP 723 metadata for `uvx marimo edit --sandbox` and molab.
dependencies = [
    "marimo>=0.14",
    "numpy>=2.0",
    "pandas>=2.0",
    "altair>=5.0",
    "pyarrow>=15.0",
]
