[project]
name = "bac-link-budget"
version = "0.7.0"
description = "Marimo notebook: first-order link budget between a LEO satellite and one ground station – margins against elevation, data per pass and per day, the AMSAT/IARU line-item budget"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Build a CubeSat contributors" }]
# A single-file marimo notebook: these dependencies are what the headless tests need; the notebook
# carries its own PEP 723 metadata for `uvx marimo edit --sandbox` and molab.
dependencies = [
    "marimo>=0.14",
    "numpy>=2.0",
    "pandas>=2.0",
    "altair>=5.0",
    "pyarrow>=15.0",
]
