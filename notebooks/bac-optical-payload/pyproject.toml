[project]
name = "bac-optical-payload"
version = "0.7.4"
description = "Marimo notebook: what a camera on a small satellite produces – GSD, swath, smear, access and illumination over a target, data volume; and the boom-camera view of the spacecraft"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Build a CubeSat contributors" }]
# A single-file marimo notebook: these dependencies are what the headless tests need; the notebook
# carries its own PEP 723 metadata for `uvx marimo edit --sandbox` and molab.
dependencies = [
    "marimo>=0.14",
    "numpy>=2.0",
    "pandas>=2.0",
    "altair>=5.0",
    "pyarrow>=15.0",
]
