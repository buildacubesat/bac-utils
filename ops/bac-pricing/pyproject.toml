[project]
name = "bac-pricing"
version = "1.4.1"
description = "Build a CubeSat assembly pricing: multi-level BOM cost rollup and price derivation as a pure engine, a marimo notebook over it, and the pricing engine of the operations suite's database."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bac-common>=0.3",
    "bac-suite-db>=0.1",
    "rich>=13.7",
    "marimo>=0.14",
    "altair>=5.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "wigglystuff>=0.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
bac-pricing = "bac_pricing.cli:main"

[project.entry-points."bac_suite.engines"]
pricing = "bac_pricing.store:ENGINE"

[project.entry-points."bac_suite.apps"]
pricing = "bac_pricing:APP"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bac_pricing"]

[tool.uv.sources]
bac-common = { workspace = true }
bac-suite-db = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
